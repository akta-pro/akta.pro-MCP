name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify release tag targets main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit already on main." >&2
            exit 1
          }

      - name: Set registry version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag must contain a semantic version such as v1.2.3." >&2
            exit 1
          }
          jq --arg version "$VERSION" '.version = $version' server.json > server.tmp
          mv server.tmp server.json

      - name: Install MCP publisher
        run: |
          curl --fail --location --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json
